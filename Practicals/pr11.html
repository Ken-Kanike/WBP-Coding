<body>
  <header class="navbar">
    <a class="brand" href="pr11.html"><i class="fa-solid fa-list-check"></i> Practical 11</a>
    <a class="nav-link" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Hub Gateway</a>
  </header>

  <main class="main-wrap">
    <div class="form-card">
      <div class="form-header">
        <h2>Department &amp; Subjects</h2>
        <p>Demonstrating List Box, Combo Box &amp; Hidden Field Token</p>
      </div>

      <form action="pr11.php" method="post">
        <div class="form-group">
          <label class="form-label" for="dept">Select Department (Combo Box)</label>
          <select id="dept" name="dept" class="form-select">
            <option value="CO">Computer Engineering (CO)</option>
            <option value="AI">Artificial Intelligence (AI)</option>
            <option value="BD">Big Data Analytics (BD)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="subjects">Select Subjects (List Box &bull; Multi-select)</label>
          <select id="subjects" name="subjects[]" class="form-select" multiple size="3">
            <option value="MAD" selected>MAD (Mobile Application Development)</option>
            <option value="PHP" selected>PHP (Web-Based Programming)</option>
            <option value="Python">Python Programming</option>
          </select>
        </div>

        <input type="hidden" name="formkey" value="1234">
        <div class="hidden-badge">
          <i class="fa-solid fa-shield-halved"></i> Hidden Field Attached: <code>formkey = 1234</code>
        </div>

        <button type="submit" name="submit" value="submit" class="btn-submit">
          <i class="fa-solid fa-paper-plane"></i> Submit Selections
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
